version: "2"
linters:
  default: all
  disable:
    - wsl # deprecated.
    - exhaustruct # deprecated.
    - exhaustruct_v5 # camera and XML structs are filled a field at a time.
    - gomodguard # deprecated.
    - depguard # not useful.
    - nlreturn
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enable-all: true
      disabled-checks:
        - whyNoLint
        - commentedOutCode
      settings:
        unnamedResult:
          checkExported: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
